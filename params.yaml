# ACRAS Project Parameters (Single Source of Truth)
# Governed by:
#   D-1.0: params.yaml established for tunable hyperparameters and thresholds.
#   D-1.1 / ADR-017: Candidate models (LogisticRegression, LightGBM, XGBoost).
#   D-1.2 / ADR-018: 5-fold cross-validated calibration with stratified split.
#   D-1.3 / ADR-019: Class weighting over resampling.
#   D-1.4 / ADR-020: Empirical calibration comparison (Platt sigmoid vs Isotonic).
#   D-1.5 / ADR-021: Fixed illustrative PD-to-rating thresholds.
#   D-1.11 / ADR-025: Yeo-Johnson transformation for continuous features.

seed: 42

split:
  test_size: 0.20
  stratify: true

cv:
  n_splits: 5
  shuffle: true
  # CAVEAT (Phase 1 EDA §6 / D-1.2):
  # With 220 total positive cases in the 6,819-row dataset, 5-fold CV leaves
  # approximately 30-40 positive cases per held-out fold after reserving the 20% test set.
  # This sample density is workable but at the lower boundary for per-fold calibration curve stability.

preprocessing:
  method: "yeo-johnson"
  standardize: true

imbalance:
  # Flag to enable/disable class weighting during model training
  # When true: scale_pos_weight is calculated for XGBoost/LightGBM, class_weight='balanced' for LogReg
  use_class_weights: true

calibration:
  # Methods to fit and evaluate on validation folds (ADR-020)
  methods:
    - "sigmoid"   # Platt scaling
    - "isotonic"  # Isotonic regression

models:
  logistic_regression:
    max_iter: 1000
    solver: "lbfgs"
    C: 1.0

  lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 5
    num_leaves: 31
    random_state: 42
    n_jobs: -1
    verbose: -1

  xgboost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    eval_metric: "logloss"

# PD-to-Credit-Rating Mapping Table (ADR-021 / PRD FR4)
# DISCLAIMER & HONESTY CAVEAT:
# These thresholds are illustrative bands drawn loosely from public rating agency conventions.
# They do NOT represent a verified, audited, or licensed reproduction of any proprietary rating agency methodology
# (e.g. S&P, Moody's, Fitch). They exist to convert calibrated continuous probabilities into discrete brackets.
rating_thresholds:
  - rating: "AAA"
    max_pd: 0.001     # PD < 0.1%
  - rating: "AA"
    max_pd: 0.0025    # 0.1% <= PD < 0.25%
  - rating: "A"
    max_pd: 0.005     # 0.25% <= PD < 0.5%
  - rating: "BBB"
    max_pd: 0.015     # 0.5% <= PD < 1.5%
  - rating: "BB"
    max_pd: 0.050     # 1.5% <= PD < 5.0%
  - rating: "B"
    max_pd: 0.150     # 5.0% <= PD < 15.0%
  - rating: "CCC/C"
    max_pd: 1.000     # PD >= 15.0%
