[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acras"
version = "0.0.1.dev0"
description = "Hybrid Agentic MLOps System for Credit Risk and Analysis"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sebastián Garrido Arévalo" }]

# Runtime dependencies — scoped to Tier 1 lean serving image (ADR-010 / ADR-022).
dependencies = [
    # Data & ML inference (Serving)
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.7.0",
    # Schema & config
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    # Serving
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.9,<1",
    "pyright>=1.1,<2",
    "httpx>=0.27,<1",
    "httpx2>=2.13.1",
]
training = [
    # Training & data pipeline dependencies (excluded from serving container per ADR-022)
    "great-expectations>=1.21,<2",
    "dvc[s3]>=3.55,<4",
    "mlflow>=2.15,<3",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
]

[tool.uv]
default-groups = ["dev", "training"]


[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Always fail if no tests collected — never silently pass an empty suite
addopts = "--strict-config --import-mode=importlib"
# Nonzero exit on no tests collected (exit code 5 by default in pytest)

